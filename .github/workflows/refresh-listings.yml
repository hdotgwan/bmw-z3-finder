name: Refresh Z3 listings

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: z3-listing-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and score listings
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scripts/fetch_listings.py
      - name: Test scoring model
        run: python -m unittest discover -s tests -v
      - name: Publish updated data
        run: |
          git config user.name "z3-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh Z3 listings"
          git push
